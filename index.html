<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Task Manager</h1>

        <div class="search-box" style="margin: 20px 0; position: relative;">
    <input 
        type="text" 
        id="searchTask" 
        placeholder="🔍 Search your tasks..."
        style="
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #a9b8f5;
            border-radius: 30px;
            background: #f5f7ff;
            color: #4a5a7a;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(100, 120, 200, 0.12);
        "
    >
    </div>

        <br>

        <div class="task-form">
            <input type="text" id="taskTitle" placeholder="Task Title">

            <textarea id="taskDescription" placeholder="Task Description"></textarea>

            <button id="addTask">Add Task</button>
        </div>

        <div id="taskList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
